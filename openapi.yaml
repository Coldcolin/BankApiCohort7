openapi: 3.0.3
info:
  title: Banking Backend API
  version: 1.0.0
  description: REST API for the banking frontend (replaces Redux persist logic)
servers:
  - url: http://localhost:3000/api/v1
    description: Local development
  - url: https://backend-banking-api.onrender.com/api/v1
    description: Render production (update hostname after deploy)
paths:
  /auth/signup:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, email, password, confirmPassword]
              properties:
                fullName: { type: string, minLength: 2 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                confirmPassword: { type: string }
      responses:
        '201':
          description: User created
        '400':
          description: Validation error
        '409':
          description: Email already exists
  /auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials
  /auth/logout:
    post:
      summary: Logout
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Logged out
  /auth/me:
    get:
      summary: Current user profile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: User with accounts and transactions
  /users/{userId}:
    delete:
      summary: Delete user account
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Account deleted
        '403':
          description: Forbidden
  /accounts:
    get:
      summary: List accounts for logged-in user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Account list
    post:
      summary: Add a new account
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountName, amount]
              properties:
                accountName: { type: string }
                amount: { type: number, minimum: 0 }
      responses:
        '201':
          description: Account created
        '400':
          description: Allowance exceeded
  /accounts/lookup/{accountNumber}:
    get:
      summary: Lookup recipient for transfers
      security: [{ bearerAuth: [] }]
      parameters:
        - name: accountNumber
          in: path
          required: true
          schema: { type: string, minLength: 9, maxLength: 9 }
      responses:
        '200':
          description: Recipient info without balance
        '404':
          description: Not found
  /accounts/{accountNumber}:
    get:
      summary: Get account by number
      security: [{ bearerAuth: [] }]
      parameters:
        - name: accountNumber
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Account details
  /transfers:
    post:
      summary: Transfer funds
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [senderAccountId, recipientAccountNumber, recipientUserId, amount]
              properties:
                senderAccountId: { type: string }
                recipientAccountNumber: { type: string, minLength: 9, maxLength: 9 }
                recipientUserId: { type: string }
                amount: { type: number, exclusiveMinimum: 0 }
                memo: { type: string }
      responses:
        '200':
          description: Transfer successful
        '400':
          description: Insufficient balance or validation error
  /transactions:
    get:
      summary: Transaction history for logged-in user
      security: [{ bearerAuth: [] }]
      parameters:
        - name: accountId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Transaction array
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
